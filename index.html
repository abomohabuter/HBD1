<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة خاصة لـ جنى ✨</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="card shadow-container">
        <div id="welcome-screen">
            <div class="gift-icon">🎁</div>
            <h2>وصلتكِ رسالة مخفية... ✨</h2>
            <p>اضغطي على الزر بالأسفل لفتح المفاجأة المجهزة لكِ!</p>
            <button id="open-btn">افتحي الهدية 🔓</button>
        </div>

        <div id="surprise-screen" class="hidden">
            <div class="celebrate-icon">🎈✨</div>
            <h1 class="birthday-title">مبارك على الـ 14 عاماً، جنى! 🤍</h1>
            <p class="wishes-text">كُلّ عـامٍ وأَنْتِ بِخَـيْر! أتمنى لكِ عاماً سعيداً مليئاً بالنجاح والتوفيق، وتحقيق كل أمنياتكِ وطموحاتكِ دائماً.</p>
            <button id="back-btn">إغلاق الرسالة</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
