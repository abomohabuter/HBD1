<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة خاصة جداً! 🎉</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="card shadow-container">
        <div id="welcome-screen">
            <div class="gift-icon">🎁</div>
            <h2>وصلتك رسالة خاصة ومخفية... ✨</h2>
            <p>اضغط على الزر بالأسفل لفتح المفاجأة المجهزة لك!</p>
            <button id="open-btn">افتح الهدية 🔓</button>
        </div>

        <div id="surprise-screen" class="hidden">
            <div class="celebrate-icon">🎂🎉</div>
            <h1 class="birthday-title">كُلّ عـامٍ وأَنْتَ بِخَـيْر!</h1>
            <p class="wishes-text">أتمنى لك عاماً مليئاً بالنجاح والتوفيق وتحقيق كل أمنياتك. يوم ميلاد سعيد وعمر مديد في طاعة الله وسعادة دائماً! 🤍</p>
            <button id="back-btn">إغلاق الرسالة</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
